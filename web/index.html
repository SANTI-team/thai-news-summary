<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปข่าววันนี้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<!-- เดโมตัวอย่าง: คนที่ 8 แต่งต่อ/เขียนใหม่ได้ แค่เรียก POST /api/summarize -->
<style>
  :root {
    --bg: #f6f3ee; --paper: #fffdf9; --ink: #1d1b18; --muted: #6d675e; --line: #e4ddd2;
    --accent: #b3261e; --accent-soft: #f6e3e1; --lead: #2f5d8a; --lead-soft: #e3ecf5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --paper: #201f1c; --ink: #ece7df; --muted: #a39b8f; --line: #3a3732;
            --accent: #ef7d74; --accent-soft: #3a2422; --lead: #8db7e0; --lead-soft: #1f2c3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 "Noto Sans Thai", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header { border-bottom: 3px double var(--line); padding-bottom: 14px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: "Noto Serif Thai", serif; font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: .5px; }
  .date { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { font-weight: 600; display: block; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 300px; resize: vertical; font: inherit; color: var(--ink); background: transparent;
             border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; padding: 8px 14px; }
  button:disabled { opacity: .6; cursor: wait; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
  .abs .tag { background: var(--accent-soft); color: var(--accent); }
  .ext .tag { background: var(--lead-soft); color: var(--lead); }
  .summary { font-family: "Noto Serif Thai", serif; font-size: 20px; line-height: 1.75; margin: 0 0 6px; }
  .ext p { color: var(--muted); margin: 0; }
  .block + .block { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .hint { color: var(--muted); font-size: 13px; }
  .chips span { display: inline-block; margin: 3px 4px 0 0; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; }
  .chips b { font-weight: 600; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .err { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>สรุปข่าววันนี้</h1>
    <div class="date" id="date"></div>
  </header>

  <div class="grid">
    <section class="card">
      <label for="text">วางเนื้อข่าว</label>
      <textarea id="text" placeholder="วางข่าวภาษาไทยที่ต้องการสรุปที่นี่"></textarea>
      <div class="row">
        <button id="go">สรุปข่าว</button>
        <button class="ghost" id="sample">ใส่ข่าวตัวอย่าง</button>
        <span class="hint" id="count"></span>
      </div>
    </section>

    <section class="card" id="out">
      <div class="empty">บทสรุปจะแสดงที่นี่</div>
    </section>
  </div>
</div>

<script>
const API = "/api/summarize";   // หน้าเว็บอยู่คนละที่ → "http://127.0.0.1:8000/api/summarize"
const SAMPLE = `กรมอุตุนิยมวิทยาออกประกาศเตือนพายุฤดูร้อนบริเวณภาคเหนือและภาคตะวันออกเฉียงเหนือ ระหว่างวันที่ 10-12 เมษายนนี้ โดยจะมีพายุฝนฟ้าคะนอง ลมกระโชกแรง และมีลูกเห็บตกบางพื้นที่ ซึ่งอาจสร้างความเสียหายต่อบ้านเรือนและพื้นที่การเกษตร นายสมชาย ใจดี อธิบดีกรมอุตุนิยมวิทยา กล่าวว่า ขอให้ประชาชนหลีกเลี่ยงการอยู่ในที่โล่งแจ้งและใต้ต้นไม้ใหญ่ ส่วนเกษตรกรควรเตรียมป้องกันความเสียหายของผลผลิต และติดตามประกาศจากกรมอุตุนิยมวิทยาอย่างใกล้ชิด ทั้งนี้ จังหวัดเชียงใหม่ เชียงราย และขอนแก่น ได้เตรียมเจ้าหน้าที่ป้องกันและบรรเทาสาธารณภัยไว้พร้อมรับมือแล้ว`;
const TYPES = { PERSON: "บุคคล", ORGANIZATION: "องค์กร", LOCATION: "สถานที่", DATE: "วันที่", TIME: "เวลา", MONEY: "เงิน" };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("date").textContent = new Date().toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const count = () => $("count").textContent = $("text").value.length ? `${$("text").value.length.toLocaleString()} ตัวอักษร` : "";
$("text").oninput = count;
$("sample").onclick = () => { $("text").value = SAMPLE; count(); };

$("go").onclick = async () => {
  const text = $("text").value.trim();
  if (text.length < 20) { $("out").innerHTML = `<p class="err">ข่าวสั้นเกินไป (อย่างน้อย 20 ตัวอักษร)</p>`; return; }
  $("go").disabled = true; $("go").textContent = "กำลังสรุป…";
  try {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!res.ok) throw new Error(`API ตอบกลับ ${res.status}`);
    const r = await res.json();
    const s = r.stats;
    const ents = r.entities.length
      ? r.entities.map(e => `<span>${esc(e.text)}<b>${TYPES[e.type] || e.type}</b></span>`).join("")
      : `<span class="hint">ไม่พบ (โมเดล NER ยังไม่พร้อม — งานคนที่ 6)</span>`;
    $("out").innerHTML = `
      <div class="block abs"><span class="tag">บทสรุป · mT5 (เขียนใหม่)</span>
        <p class="summary">${esc(r.summary)}</p>
        <div class="hint">${s.summary_chars} จาก ${s.news_chars.toLocaleString()} ตัวอักษร · ${s.seconds} วินาที${s.truncated ? " · ข่าวยาวเกิน ถูกตัดท้าย" : ""}</div></div>
      <div class="block ext"><span class="tag">เทียบ · Lead-3 (3 ประโยคแรก)</span><p>${esc(r.lead3)}</p></div>
      <div class="block"><label>ชื่อเฉพาะในข่าว</label><div class="chips">${ents}</div></div>
      <div class="block hint">⚠️ บทสรุปจากโมเดลอาจมีข้อมูลที่ข่าวไม่ได้พูด ควรตรวจกับต้นฉบับ</div>`;
  } catch (e) {
    $("out").innerHTML = `<p class="err">เรียก API ไม่ได้: ${esc(e.message)} — รัน <code>python api.py</code> แล้วหรือยัง</p>`;
  } finally { $("go").disabled = false; $("go").textContent = "สรุปข่าว"; }
};
</script>
</body>
</html>
