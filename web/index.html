<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจข่าวปลอม</title>
<!-- หน้าเว็บตัวอย่างขั้นต่ำ: เพื่อนเอาไปแต่งต่อ หรือเขียนใหม่ด้วย React/Vue ก็ได้ แค่เรียก /api/predict -->
<style>
  body { font-family: system-ui, "Noto Sans Thai", sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
  textarea { width: 100%; height: 120px; font: inherit; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 10px 20px; font: inherit; cursor: pointer; }
  #verdict { margin-top: 16px; padding: 14px; border-radius: 8px; color: #fff; font-size: 20px; display: none; }
  .bar { height: 8px; background: #ddd; border-radius: 4px; margin: 2px 0 8px; }
  .bar > div { height: 100%; border-radius: 4px; }
  .tag { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 4px; background: #eef; }
</style>
</head>
<body>
<h1>ตรวจข่าวปลอมภาษาไทย</h1>
<textarea id="text" placeholder="วางข้อความข่าวที่นี่"></textarea>
<button id="go">ตรวจสอบ</button>
<div id="verdict"></div>
<div id="details"></div>

<script>
const API = "/api/predict";           // ถ้าหน้าเว็บอยู่คนละที่ ใช้ "http://127.0.0.1:8000/api/predict"
const COLORS = { "จริง": "#2e9e5b", "ปลอม": "#d64545", "บิดเบือน": "#e0a020" };

document.getElementById("go").onclick = async () => {
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const r = await res.json();

  const v = document.getElementById("verdict");
  v.style.display = "block";
  v.style.background = COLORS[r.label] || "#666";
  v.textContent = `ผลทำนาย: ${r.label} (${Math.round(r.confidence * 100)}%)`;

  let html = "<h3>ความน่าจะเป็น</h3>";
  for (const [k, p] of Object.entries(r.probabilities))
    html += `${k} ${Math.round(p * 100)}%<div class="bar"><div style="width:${p * 100}%;background:${COLORS[k] || "#666"}"></div></div>`;
  html += "<h3>สัญญาณเตือน</h3>" + (r.warnings.length ? r.warnings.map(w => `<div>⚠️ ${w}</div>`).join("") : "ไม่พบ");
  html += "<h3>ชื่อเฉพาะในข่าว</h3>" + (r.entities.map(e => `<span class="tag">${e.text} · ${e.type}</span>`).join("") || "ไม่พบ");
  document.getElementById("details").innerHTML = html;
};
</script>
</body>
</html>
